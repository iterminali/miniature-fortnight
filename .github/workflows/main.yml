
name: "Sanity Check"

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.ini"

  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.ini"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Docker DNS
        run: |
          echo '{"dns":["1.1.1.1","8.8.8.8"]}' \
            | sudo tee /etc/docker/daemon.json

          sudo systemctl restart docker
          sleep 5

      - name: Build with PS4 Payload SDK
        uses: Scene-Collective/ps4-payload-sdk@v1.0.0
        with:
          app_path: .
          build_command: bash build.sh

      - name: Verify build
        run: |
          test -s sanity-check
          echo "Sanity Check passed!"

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Sanity-Check
          path: sanity-check
