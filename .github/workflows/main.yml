name: "Sanity Check"

on:
  push:
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "**.ini"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "**.ini"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Docker DNS
        run: |
          echo '{"dns":["1.1.1.1","8.8.8.8"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5

      - name: Build with PS4 Payload SDK (14.02)
        # ✅ FIXED: 'latest' is not a valid tag. The official README
        # for Scene-Collective/ps4-payload-sdk specifies @v1.
        uses: Scene-Collective/ps4-payload-sdk@v1
        with:
          app_path: .
          build_command: bash build.sh

      - name: Verify payload file
        run: |
          if [ ! -s payload.bin ]; then
            echo "ERROR: payload.bin missing!"
            ls -lah
            exit 1
          fi
          echo "payload.bin successfully generated!"
          ls -lh payload.bin
          sha256sum payload.bin | tee payload.sha256

      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: payload-${{ github.sha }}
          path: |
            payload.bin
            payload.sha256

      - name: Determine release tag
        if: github.event_name != 'pull_request'
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG"        >> "$GITHUB_OUTPUT"
            echo "is_release=true"      >> "$GITHUB_OUTPUT"
          else
            TAG="sanity-check-${GITHUB_RUN_NUMBER}"
            echo "tag_name=$TAG"        >> "$GITHUB_OUTPUT"
            echo "is_release=false"     >> "$GITHUB_OUTPUT"
          fi

      - name: Publish payload (tag or prerelease)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ steps.vars.outputs.tag_name }}
          IS_REL:   ${{ steps.vars.outputs.is_release }}
        run: |
          set -e
          if [ "$IS_REL" = "true" ]; then
            # Real release triggered by pushing a tag.
            # Create it if it doesn't exist, otherwise upload/overwrite.
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" payload.bin payload.sha256 --clobber
            else
              gh release create "$TAG" payload.bin payload.sha256 \
                --target "$GITHUB_SHA" \
                --title "$TAG" \
                --generate-notes
            fi
          else
            # Prerelease per run (uses run number, never collides).
            gh release create "$TAG" payload.bin payload.sha256 \
              --target "$GITHUB_SHA" \
              --title "Sanity Check $TAG" \
              --prerelease \
              --generate-notes
          fi

      - name: Print release URL
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ steps.vars.outputs.tag_name }}
        run: |
          URL=$(gh release view "$TAG" --json url --jq .url)
          SHA=$(sha256sum payload.bin | awk '{print $1}')
          {
            echo "=================================="
            echo "SANITY CHECK RELEASE SUCCESSFUL"
            echo "=================================="
            echo "Release URL : $URL"
            echo "SHA-256     : $SHA"
            echo "=================================="
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "[Open GitHub Release]($URL)" >> "$GITHUB_STEP_SUMMARY"
