
name: "Sanity Check"

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.ini"

  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.ini"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Docker DNS
        run: |
          echo '{"dns":["1.1.1.1","8.8.8.8"]}' \
            | sudo tee /etc/docker/daemon.json

          sudo systemctl restart docker
          sleep 5

      - name: Build with PS4 Payload SDK
        uses: Scene-Collective/ps4-payload-sdk@v1.0.0
        with:
          app_path: .
          build_command: bash build.sh

      - name: Verify build
        run: |
          test -s sanity-check
          echo "Build successful!"

      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Sanity-Check
          path: sanity-check

      - name: Determine release tag
        if: github.event_name != 'pull_request'
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            TAG="sanity-check-${GITHUB_RUN_NUMBER}"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload tagged release
        if: github.event_name != 'pull_request' && steps.vars.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: |
          gh release upload "$TAG" sanity-check --clobber

      - name: Create prerelease
        if: github.event_name != 'pull_request' && steps.vars.outputs.is_release == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: |
          gh release create "$TAG" sanity-check \
            --target "$GITHUB_SHA" \
            --title "Sanity Check $TAG" \
            --prerelease \
            --generate-notes

      - name: Print release URL
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: |
          URL=$(gh release view "$TAG" --json url --jq .url)

          echo "=================================="
          echo "SANITY CHECK RELEASE SUCCESSFUL"
          echo "=================================="
          echo "Release URL: $URL"
          echo "=================================="

          echo "RELEASE_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
